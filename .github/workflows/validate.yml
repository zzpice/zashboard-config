name: Validate Zashboard settings

on:
  push:
    branches: [main]
    paths:
      - "zashboard-settings.json"
      - ".github/workflows/validate.yml"
      - "scripts/**"
  pull_request:
    paths:
      - "zashboard-settings.json"
      - ".github/workflows/validate.yml"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate public settings
        run: |
          python3 scripts/validate.py
          python3 -m unittest discover -s scripts -p 'test_*.py'
